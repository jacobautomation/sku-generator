<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — SKU &amp; Description Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg: #1c2028; --panel: #22262f; --panel-2: #2d3242; --border: #343a48;
    --text: #e6e6e6; --muted: #9aa2b1; --accent: #4664b4; --mono:'JetBrains Mono',monospace;
    --sans:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--bg); color: var(--text); font-family: var(--sans);
  }
  .box{
    width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px;
  }
  .mark{
    width:36px; height:36px; border:1.5px solid var(--accent); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-weight:600; color: var(--accent); margin-bottom: 14px;
  }
  h1{ font-size: 16px; margin: 0 0 4px 0; }
  .sub{ font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
  .field{ margin-bottom: 14px; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size: 12px; color: var(--muted); }
  .field input{
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: 7px; font-size: 13.5px;
  }
  .field input:focus{ outline:none; border-color: var(--accent); }
  button{
    width:100%; background: var(--accent); border: 1px solid var(--accent); color:#fff;
    font-weight:600; font-size: 13.5px; padding: 10px; border-radius: 8px; cursor:pointer;
    margin-top: 6px;
  }
  button:hover{ filter: brightness(1.1); }
  .errorlist{ color:#e08a7a; font-size:12px; list-style:none; padding:0; margin:0 0 10px 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">SK</div>
    <h1>SKU &amp; Description Generator</h1>
    <div class="sub">Sign in to continue</div>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <ul class="errorlist"><li>Incorrect username or password.</li></ul>
      {% endif %}
      <div class="field">
        <label>Username</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label>Password</label>
        {{ form.password }}
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
